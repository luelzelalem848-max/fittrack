<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitTrack — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login-screen.css" />
</head>
<body data-logo="💪">
<script>
  /* already signed in? go straight to the app */
  try {
    if ((JSON.parse(localStorage.getItem('fittrack_profile')||'{}')).name) location.replace('app.html');
  } catch (e) {}
</script>

<div class="lg-stage">
  <video class="fx-video" autoplay muted loop playsinline preload="auto" disablepictureinpicture aria-hidden="true"><source src="assets/bg-video.mp4" type="video/mp4"></video>
<canvas id="scene3d"></canvas>
  <div class="lg-vignette"></div>
</div>

<div class="lg-grid">
  <div class="lg-brand rv-in">
    <div class="lg-brand-logo">💪</div>
    <h1 class="lg-brand-name">FitTrack</h1>
    <p class="lg-brand-tag">Log every rep. Watch yourself rise.</p>
    <div class="lg-brand-points">
      <span>✦ Every session recorded</span>
      <span>✦ Progress that motivates</span>
      <span>✦ Works offline in the gym</span>
    </div>
    <a class="lg-back" href="index.html">← Back to site</a>
  </div>

  <div class="lg-center">
    <form class="lg-card" id="lgCard" autocomplete="off">
      <div class="lg-halo"></div>
      <div class="lg-logo">💪</div>
      <h2 class="lg-title">ENTER THE ARENA.</h2>
      <p class="lg-sub">Tell us your name, athlete.</p>
      <input class="lg-input" id="lgName" type="text" placeholder="Your name, champion..." maxlength="40" autocomplete="off" />
      <p class="lg-error" id="lgError">Name up first. No excuses 💪</p>
      <button class="lg-cta" type="submit" id="lgCta">Start Training →</button>
      <p class="lg-foot">🔒 Your training log stays on this device.</p>
    </form>
  </div>
</div>

<script src="vendor/three.min.js"></script>
<script src="scene3d.js"></script>
<script src="fx-pack.js"></script>
<script>
(function () {
  var input = document.getElementById('lgName'),
      card = document.getElementById('lgCard'),
      err = document.getElementById('lgError'),
      cta = document.getElementById('lgCta');
  setTimeout(function () { input.focus(); }, 700);

  function go() {
    var name = (input.value || '').trim();
    if (!name) {
      err.classList.add('lg-show');
      card.classList.remove('lg-shake');
      void card.offsetWidth;
      card.classList.add('lg-shake');
      input.focus();
      return;
    }
    try { var p = JSON.parse(localStorage.getItem('fittrack_profile')||'{}'); p.name = name; localStorage.setItem('fittrack_profile', JSON.stringify(p)); } catch(e) { localStorage.setItem('fittrack_profile', JSON.stringify({ name: name })); }
    cta.textContent = 'Loading the bar...';
    card.classList.add('lg-closing');
    setTimeout(function () { location.href = 'app.html'; }, 460);
  }
  card.addEventListener('submit', function (e) { e.preventDefault(); go(); });
  input.addEventListener('input', function () { err.classList.remove('lg-show'); });
})();
</script>
</body>
</html>
